name: Security Audit

on:
  push:
    branches: [main]
    paths:
      - "**/go.mod"
      - "**/go.sum"
      - "mise.toml"
      - "mise.lock"
      - "mise.ci.toml"
      - "mise.ci.lock"
      - ".github/workflows/audit.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/go.mod"
      - "**/go.sum"
      - "mise.toml"
      - "mise.lock"
      - "mise.ci.toml"
      - "mise.ci.lock"
      - ".github/workflows/audit.yml"
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      MISE_LOCKED: "1"
      MISE_ENV: "ci"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          install_args: 'go "go:golang.org/x/vuln/cmd/govulncheck"'
          add_shims_to_path: true
          cache_key: "mise-audit-{{install_args_hash}}-{{file_hash}}"

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-audit-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-audit-${{ runner.os }}-

      - name: Audit
        run: mise run audit
